id: coder
department: engineering
reports_to: tech_lead
worker: cli
# Agent con của các phòng provider, theo thứ tự ưu tiên; sửa code trong bản sao repo tại worker.
workers: [claude, codex, cursor]
model: coder-model
prompt: prompts/coder.md
tools:
  - server: gitlab
    allow: [read_file, download_archive, create_branch, push, open_merge_request,
            get_merge_request]
    constraints:                # MCP server kiểm tra lại tham số, không chỉ guard
      repos: [VX-Anh/aico-office, VX-Anh/linh-hoa-vien, VX-Anh/ai-trace]
      branch_pattern: "ai/*"
max_risk: L2                    # hành động L3 luôn phải qua người duyệt
budget:
  per_ticket_usd: 5
  monthly_usd: 300
  per_ticket_tokens: 2000000
limits:
  max_iterations: 40
  timeout_minutes: 45
