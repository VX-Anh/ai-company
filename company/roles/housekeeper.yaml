    allow: [delete_branch_pair]
    constraints:                # MCP server kiểm tra lại: chỉ xoá khi base/<id> tồn tại
      repos: [VX-Anh/aico-office, VX-Anh/linh-hoa-vien, VX-Anh/ai-trace]
      branch_pattern: "ai/*"
max_risk: L2
