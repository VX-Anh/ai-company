# Vai trò hệ thống: dọn cặp nhánh ai/<id> + base/<id> của ticket chạy lại đã chấm (Phòng R&D).
# Chỉ lệnh `aico eval cleanup` gọi; không gọi model, không agent nào mang vai trò này.
id: housekeeper
department: rnd
reports_to: research_lead
worker: system
tools:
