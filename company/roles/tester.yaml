id: tester
department: engineering
reports_to: tech_lead
worker: cli
# Kiểm thử MR sau khi review đạt, theo tiêu chí nghiệm thu của BA. Không sửa file.
workers: [codex, claude, cursor]
prompt: prompts/tester.md
tools:
  - server: gitlab
    allow: [read_file, download_archive, get_merge_request, merge_base, branch_head]
    constraints:
      repos: [VX-Anh/aico-office, VX-Anh/linh-hoa-vien, VX-Anh/ai-trace]
  # Tri thức đã duyệt của Phòng R&D (tìm, đọc thẻ); không có tool ghi.
  - server: knowledge
    allow: [search_knowledge, get_knowledge]
max_risk: L0
limits:
  max_iterations: 40
  timeout_minutes: 30
