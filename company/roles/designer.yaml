id: designer
department: engineering
reports_to: tech_lead
worker: cli
# Vẽ sprite, animation pixel cho repo GUI (aico-office) bằng Pixelbolt.
# Chỉ codex: Codex CLI có công cụ sinh ảnh dựng sẵn ($imagegen, gói ChatGPT), dùng cho quy trình
# vẽ của linh-hoa-vien (docs/research/art-tools.md K-ART-1). Để thêm phòng khác thì đầu việc song
# song (spread) và xếp hạng hạn mức đẩy job vẽ sang phòng không đăng nhập Codex (T-f58ee583).
workers: [codex]
prompt: prompts/designer.md
tools:
  - server: pixel
    allow: [pixel_help, pixel_validate, pixel_inspect, pixel_patch, pixel_render,
            pixel_compile, pixel_scene, pixel_import]
  - server: gitlab
    allow: [read_file]
    constraints:
      repos: [VX-Anh/aico-office, VX-Anh/linh-hoa-vien]
max_risk: L1
limits:
  max_iterations: 40
  timeout_minutes: 30
