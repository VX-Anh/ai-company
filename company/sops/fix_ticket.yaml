id: fix_ticket
department: engineering
graph: fix_ticket
steps:
  triage: chief_of_staff
  analyze: ba                   # bỏ qua với ticket rủi ro thấp và ticket retro
  plan: tech_lead
  code: coder
  review: reviewer
  test: tester                  # sau khi review đạt; chưa đạt thì quay lại coder
  merge: merge_bot
limits:
  max_plan_rounds: 2
  max_review_rounds: 3
  max_test_rounds: 2
  max_merge_attempts: 2
  approval_deadline_hours: 48
# Cổng trước review: kiểm tất định (không gọi model) nhánh ai/<ticket> sau bước code.
# Mức của từng kiểm tra: off | warn | block. warn = ghi vi phạm vào event `gate` (would_block)
# rồi vẫn cho tới review; block = trả về bước code kèm danh sách file, quá max_rounds lần liên
# tiếp thì escalate. Đang để warn để đo tỷ lệ chặn nhầm (/rnd/metrics, khối gate) trước khi bật block.
prereview_gate:
  enabled: true
  deletions: warn               # xoá file ngoài owns mà kế hoạch/ticket/góp ý không nêu
  outside_owns: warn            # sửa/thêm file ngoài owns (bỏ qua khi kế hoạch không chia owns)
  unfinished_items: warn        # bảng đầu việc còn dòng lỗi/bỏ qua
  stale_base: warn              # off | warn: nhánh dựng trên gốc cũ chỉ ghi chú vào event gate
  # checks: chạy build/test/typecheck của repo trên đầu nhánh ai/<id> ở máy build (một lần chạy
  # gộp các bước mỗi lượt qua cổng, không gọi model). Máy build lỗi/bận/hết giờ thì bỏ, không chặn.
  checks: warn                  # off | warn | block
  checks_timeout: 900           # giây cho cả lần chạy khi repo không đặt timeout riêng
  checks_skip_labels: [research, docs, retro]   # ticket không phải code: không chạy checks
  # Lệnh theo repo; repo không có ở đây thì bỏ kiểm tra checks. Máy build đã cài dependency theo
  # lockfile (npm ci / pnpm install --frozen-lockfile) trước khi chạy, các bước chạy KHÔNG có mạng:
  # không ghi lệnh cài ở đây. Bước hỏng thì dừng, bước sau không chạy.
  check_projects:
    VX-Anh/aico-office:
      steps:
        - {name: typecheck, run: npm run typecheck}
        - {name: build, run: npm run build}
        - {name: test, run: npm test}
    # ai-trace, linh-hoa-vien: tạm chưa bật (máy build cục bộ ~6 GB RAM, chưa chạy thử đủ).
    # Lệnh dự kiến: ai-trace pnpm -r build / pnpm -r typecheck / pnpm test;
    # linh-hoa-vien npm run typecheck / npm run build / npm test.
  max_rounds: 2
  skip_labels: []               # nhãn không qua cổng (research đã bị kẹp trong cards/ bởi label_scopes)
