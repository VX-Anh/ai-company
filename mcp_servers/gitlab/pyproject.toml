[project]
name = "mcp-gitlab"
version = "0.1.0"
description = "MCP server GitLab của AI Company OS: giữ credential, kiểm tra ràng buộc repo và branch"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.9",
    "httpx>=0.27",
]

[project.scripts]
mcp-gitlab = "mcp_gitlab.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gitlab"]
