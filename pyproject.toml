[project]
name = "aico"
version = "0.1.0"
description = "AI Company OS: công ty agent khai báo bằng cấu hình"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=1.9",
    "langchain>=1.0",
    "langchain-openai>=1.0",
]

[project.optional-dependencies]
observability = ["langfuse>=3.0"]

[project.scripts]
aico = "aico.cli:main"

[dependency-groups]
dev = [
    "mcp-gitlab",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pgserver>=0.1.4",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aico"]

[tool.uv.workspace]
members = ["mcp_servers/*"]

[tool.uv.sources]
mcp-gitlab = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "mcp_servers/gitlab/src", "tests"]
# Code trong tài liệu là phác thảo, không format.
extend-exclude = ["document"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pyright]
include = ["src", "mcp_servers/gitlab/src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests", "mcp_servers/gitlab/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: cần biến môi trường AICO_TEST_DATABASE_URL trỏ tới Postgres thật"]
