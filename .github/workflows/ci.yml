name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run aico check-config company

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aico_test
          POSTGRES_USER: aico
          POSTGRES_PASSWORD: aico
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aico -d aico_test"
          --health-interval 5s
          --health-retries 20
    env:
      AICO_TEST_DATABASE_URL: postgresql://aico:aico@localhost:5432/aico_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run pytest -q
